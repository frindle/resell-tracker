name: Docker build

# Proves Dockerfile.all-in-one still builds (no push, nothing loaded). The path
# filter keeps this off every other pull request, so it is not a required check
# for them.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.all-in-one
      - .dockerignore
      - docker/**
      - package.json
      - package-lock.json
      - sidecar/**
      - giftcard-ocr/**
      - prisma/**
      - next.config.*
      - tsconfig.json
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all-in-one image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile.all-in-one
          push: false
          load: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
