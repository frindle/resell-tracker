name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Type check
        run: npx tsc --noEmit

      # Node's built-in runner with type stripping — no test framework is
      # installed. Kept in the typecheck job because it needs the same install.
      - name: Unit tests
        run: npm test

      - name: Sidecar tests
        working-directory: sidecar
        run: |
          npm ci
          npm test

      - name: NumLock watcher test
        run: bash docker/test-numlock-watch.sh
