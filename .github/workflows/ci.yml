name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Type check
        run: npx tsc --noEmit

      # Node's built-in runner with type stripping — no test framework is
      # installed. Kept in the typecheck job because it needs the same install.
      - name: Unit tests
        run: npm test

  # Continuous deployment: once `typecheck` (tsc + npm test) passes on a push to
  # main, deploy on the self-hosted runner that lives on the Unraid host — the
  # only place that can reach the reselling-app-1 container. Cloud runners can't.
  deploy:
    name: Deploy to Unraid
    needs: [typecheck]
    # Only real merges/pushes to main deploy — never PRs, never other branches.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Distinctive label so this job ONLY lands on the Unraid runner Penn
    # registers (see docs/DEPLOY.md). No runner with this label => job queues.
    runs-on: [self-hosted, unraid]
    # Serialize deploys so two quick merges can't build/restart concurrently.
    # cancel-in-progress:false => let an in-flight deploy finish, then run next.
    concurrency:
      group: reselling-deploy
      cancel-in-progress: false
    steps:
      # No actions/checkout: update.sh does its own `git fetch + reset --hard`
      # to origin/main (survives force-pushes) and bakes BUILD_SHA so the app's
      # NavBar "update available" badge works. It is the ONLY correct deploy
      # path — do not substitute raw git pull / docker-compose build here.
      - name: Run update.sh on the Unraid host
        run: bash /mnt/user/appdata/reselling/update.sh
