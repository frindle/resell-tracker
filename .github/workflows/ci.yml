name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Type check
        run: npx tsc --noEmit

      # Node's built-in runner with type stripping — no test framework is
      # installed. Kept in the typecheck job because it needs the same install.
      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy to Unraid
    needs: typecheck
    # Only on a real push to main (never on PRs), and only after typecheck+tests pass.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Requires a self-hosted runner registered on Unraid with these labels.
    # Until that runner is ONLINE, do NOT merge this file to main — a self-hosted
    # job with no matching runner queues indefinitely and blocks the run.
    runs-on: [self-hosted, unraid, resell]
    steps:
      - name: Deploy via update.sh (fetch+reset --hard, sets BUILD_SHA)
        run: /mnt/user/appdata/reselling/update.sh
