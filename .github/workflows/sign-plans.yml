name: Sign plans

# Signs config/plans.json with the PLANS_SIGNING_KEY secret and commits config/plans.json.sig
# to the PR branch. The deployed image is built on the server from main, so the signature must
# be in the branch before merge. Pushes made with GITHUB_TOKEN do not start workflows, so the
# last step dispatches CI (the "TypeScript" job) on the new head.
on:
  pull_request:
    paths: [config/plans.json, config/plans.pub]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sign-plans-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign plans
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Sign
        env:
          PLANS_SIGNING_KEY: ${{ secrets.PLANS_SIGNING_KEY }}
        run: node scripts/sign-plans.mjs

      - name: Commit and push the signature
        id: push
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain config/plans.json.sig)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/plans.json.sig
          git commit -m "Sign step plans"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the new head
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"
