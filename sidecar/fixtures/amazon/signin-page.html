<!DOCTYPE html><html lang="en-us"><head><title>Amazon Sign-In</title></head>
<body>
<div id="authportal-main-section" class="a-section">
<div class="a-section a-spacing-base auth-pagelet-container">
<form method="post" novalidate action="https://www.amazon.com/ax/claim" class="auth-validate-form auth-real-time-validation a-spacing-none">
<input type="hidden" name="appAction" value="SIGNIN_CLAIM_COLLECT">
<input type="hidden" name="subPageType" value="FullPageUnifiedClaimCollect">
<div class="a-section"><h1>Sign in or create account</h1>
<p class="a-spacing-micro a-text-bold">Enter mobile number or email</p>
<input type="text" id="ap_email_login" autocomplete="webauthn" name="email" class="a-input-text" aria-label="Enter mobile number or email" inputmode="email">
<span id="continue" class="a-button a-button-primary"><span class="a-button-inner"><input class="a-button-input" type="submit" aria-labelledby="continue-announce"><span id="continue-announce" class="a-button-text">Continue</span></span></span>
<p>By continuing, you agree to Amazon's Conditions of Use and Privacy Notice.</p>
</div>
</form>
</div>
</div>
</body></html>
