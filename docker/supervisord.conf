; ===========================================================================
; resell-tracker all-in-one container -- process supervision
;
; WHY SUPERVISORD AND NOT s6-overlay
;   s6-overlay's real advantage is a true readiness-gated dependency graph
;   (s6-rc `dependencies` + notification-fd). That advantage is largely spent
;   here, because the one dependency that actually matters -- "x11vnc must not
;   fetch VNC passwords before the app is serving" -- is already expressed as
;   an HTTP readiness poll that has to exist either way (it was the 2026-08-21
;   fix in the old sidecar entrypoint, and it stays as the safety net). What is
;   left is coarse ordering plus per-program restart policy, which is exactly
;   what supervisord's `priority` + `autorestart` do, in one ini file that
;   `docker exec -it <c> supervisorctl status` can introspect live. s6 would
;   have meant a tarball fetch, a /etc/s6-overlay/s6-rc.d tree of one-file-
;   per-setting directories, and a second thing to know before touching this
;   container.
;
; LOGGING
;   Every program writes to /dev/fd/1 with rotation disabled, and stderr is
;   folded into stdout, so all of it lands in `docker logs` as one stream --
;   no log files inside the container for anyone to have to find. supervisord
;   itself logs to stdout via nodaemon (logfile is /dev/null on purpose:
;   nodaemon ALREADY adds a stdout handler, and pointing logfile at
;   /dev/stdout as well would print everything twice).
;
; ORDERING
;   `priority` sets spawn order only -- supervisord never waits for readiness.
;   The actual dependency enforcement lives in the wrapper scripts
;   (wait_for_x / wait_for_tcp / wait_for_http in docker/lib.sh), which re-run
;   on every individual restart, not just at container boot.
;
; FATAL HANDLING
;   [eventlistener:critical-exit] takes the whole container down (exit 137) if
;   a program named in $CRITICAL_PROGRAMS reaches FATAL. See critical-exit.py.
; ===========================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info
user=root
; Chrome forks a lot; supervisord reaps any reparented child, and compose sets
; `init: true` so tini sits above it as PID 1 for signal handling.
minfds=10240
minprocs=200

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; So `docker exec -it <container> supervisorctl status` / `restart app` /
; `tail -f poll` just work, which is the operational thing three separate
; containers used to give for free via `docker restart <one of them>`.
[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


; --- the app: first, because everything else's readiness gate is its HTTP ---
[program:app]
command=/opt/docker/start-app.sh
directory=/app
priority=100
autostart=true
autorestart=true
; `prisma migrate deploy` + Next.js cold start. Must exceed the slow case or
; a healthy-but-slow boot would be counted as a failed start.
startsecs=20
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- X server: no dependencies, starts alongside the app -------------------
[program:xvfb]
command=/opt/docker/start-xvfb.sh
priority=100
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- VNC: waits for X, then for the app, then fetches passwords ------------
[program:x11vnc]
command=/opt/docker/start-x11vnc.sh
priority=200
autostart=true
autorestart=true
startsecs=5
; Generous: the wrapper's own app-readiness wait is bounded, and a container
; whose app is slow to come up should keep retrying rather than give up on
; interactive login for the rest of its life.
startretries=20
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
command=/opt/docker/start-websockify.sh
priority=300
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- sidecar Node processes: both drive Chrome on the shared display -------
[program:login-queue]
command=/opt/docker/start-sidecar.sh loginQueue
directory=/opt/sidecar
priority=300
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=15
; Chrome is a process TREE. Without these, stopping this program leaves
; orphaned renderers holding the X display and /data/sessions locks.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:poll]
command=/opt/docker/start-sidecar.sh poll
directory=/opt/sidecar
priority=300
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- gift-card OCR: last, lowest priority, deliberately NOT critical -------
; It ships dormant (GIFTCARD_OCR_ENABLED=false) and the app 404s every OCR
; route unless that flag is exactly "true", so this must never be able to take
; the dashboard down with it. Model load at boot is slow by design
; (OCR_PRELOAD pays the cost here instead of on the first request), hence the
; long startsecs.
[program:giftcard-ocr]
command=/opt/docker/start-ocr.sh
directory=/opt/giftcard-ocr
priority=400
autostart=true
autorestart=true
startsecs=30
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- container-level failure escalation ------------------------------------
; Priority 1: running before everything else means no FATAL can slip past
; during startup.
[eventlistener:critical-exit]
command=/opt/docker/critical-exit.py
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
startsecs=3
startretries=100
; stdout is the event-protocol channel and MUST NOT be redirected. All of the
; listener's own output goes to stderr, which is pointed at the container's
; stderr so it still reaches `docker logs`.
redirect_stderr=false
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
