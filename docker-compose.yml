# ===========================================================================
# resell-tracker -- ONE container.
#
# This used to be three services (app / sidecar / giftcard-ocr) on three
# macvlan addresses. They are now a single image (Dockerfile.all-in-one) with
# supervisord inside it. The three per-service Dockerfiles (./Dockerfile,
# ./sidecar/Dockerfile, ./giftcard-ocr/Dockerfile) are still in the tree and
# still build, so rolling this back is a revert of THIS FILE alone --
# `git revert` the commit that introduced it and nothing else has to move.
#
# The documented update flow is unchanged:
#     git pull && docker-compose build && docker-compose up -d
# and ./update.sh (fetch + hard reset to origin/main, then build with
# BUILD_SHA baked in, then up -d) works exactly as before.
#
# NETWORKING -- what changed
#   Before:  10.0.12.39  app          (MAC 02:f3:a1:9b:c7:04)
#            10.0.12.40  sidecar      (MAC 02:f3:a1:9b:c7:05)
#            10.0.12.42  giftcard-ocr (MAC 02:f3:a1:9b:c7:06)
#   Now:     10.0.12.39  everything   (MAC 02:f3:a1:9b:c7:04)  <- app identity
#
#   ==> 10.0.12.40 and 10.0.12.42 are now FREE. So are MACs
#       02:f3:a1:9b:c7:05 and 02:f3:a1:9b:c7:06. Nothing else in this repo
#       references them; remove them from any DHCP reservation / IP ledger.
#
#   Ports on the single address, no collisions:
#     3000  Next.js app
#     5900  x11vnc          (interactive login display)
#     6080  noVNC over HTTP (websockify)
#     6081  sidecar VNC-password refresh listener (src/poll.js)
#     8080  gift-card OCR   (Flask/waitress)
#
#   Internal traffic that used to cross the macvlan now goes over loopback:
#   TRACKER_URL and GIFTCARD_OCR_URL both point at 127.0.0.1. SIDECAR_IP
#   stays a REAL address because it is also what /api/sidecar/info hands to
#   the browser to build the "connect to VNC" link -- pointing it at loopback
#   would render a link to the user's own laptop.
# ===========================================================================

services:
  # Still called `app`, not something like `resell-tracker`, on purpose: the
  # compose service name is what every existing habit and doc line is built
  # on -- `docker-compose logs -f app`, `docker-compose restart app`, and the
  # container name `resell-tracker-app-1`. Renaming it would have churned all
  # of that for cosmetics. It just happens to contain everything now.
  #
  # MIGRATION, ONE TIME ONLY: the old `sidecar` and `giftcard-ocr` containers
  # are now orphans of this compose project. `docker-compose up -d` leaves
  # them running and prints an orphan warning. Clear them once with:
  #     docker-compose down            # stops all three old containers
  #     docker-compose up -d           # brings the single one up
  # or `docker-compose up -d --remove-orphans` in a single step.
  app:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
    mac_address: "02:f3:a1:9b:c7:04"
    networks:
      br0:
        ipv4_address: ${CONTAINER_IP}
    volumes:
      - /mnt/user/appdata/reselling:/data
      - /mnt/user/data/Documents/GC:/data/files
    # Chrome needs it. Unchanged from the old sidecar service -- Chrome
    # crashes with "Failed to move to new namespace"/renderer OOMs on the
    # 64MB Docker default.
    shm_size: "512mb"
    # tini as PID 1 above supervisord. Chrome orphans a lot of grandchildren
    # and this is what reaps them; supervisord should be supervising, not
    # playing init.
    init: true
    # -----------------------------------------------------------------
    # THE CPU CAP -- this is NOT equivalent to what it replaces.
    #
    # Before: giftcard-ocr alone carried `cpus: 2.0`, a real per-service
    # cgroup quota that guaranteed an OCR burst could never starve the array,
    # the app container, or the sidecar's Chrome. app and sidecar were
    # uncapped.
    #
    # After: one container is one cgroup, so a per-process quota is not
    # available. This key caps the WHOLE stack instead, and the OCR-specific
    # containment moved inside the container (CPU affinity + nice --- see the
    # long comment at the top of docker/start-ocr.sh). Net effect:
    #   * the array and every other container are still protected, by this
    #     cap, and now from the app and Chrome too, which they were not before
    #   * OCR is still held to ~2 cores, by taskset affinity rather than by a
    #     quota, and now also yields to the app and Chrome via nice
    #   * what is genuinely GONE is the hard guarantee that OCR cannot take
    #     CPU away from the app/Chrome *inside this container* --- affinity
    #     plus nice makes that very unlikely, not impossible
    # Raise/lower freely; delete the key to restore the old uncapped-app
    # behaviour (OCR stays contained either way).
    cpus: ${RT_CPUS:-8.0}
    environment:
      # --- app ---------------------------------------------------------
      DATABASE_URL: file:/data/resell.db
      BFMR_SUBMIT_UI_ENABLED: "true"
      # Encrypts CC/BG/BFMR/Costco passwords at rest (lib/secrets.ts).
      # Without this set, those settings are stored in plaintext.
      # Generate with: openssl rand -hex 32
      EXTENSION_DATA_KEY: ${EXTENSION_DATA_KEY}
      # Gates the X-Extension-User-Id header (browser extension / sidecar
      # sync calls) so it can't be used to impersonate an arbitrary
      # userId from the LAN. Generate with: openssl rand -hex 32
      EXTENSION_SHARED_SECRET: ${EXTENSION_SHARED_SECRET}
      # Signs the resell_uid session cookie (lib/auth.ts) so it can't be
      # forged. Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET}
      # Set to "true" only if you put TLS in front of this app (this
      # compose file itself serves plain HTTP over the LAN macvlan) —
      # adds the Secure flag to the session cookie. Leave unset for the
      # default LAN-HTTP deployment or logins will silently stop working.
      COOKIE_SECURE: ${COOKIE_SECURE:-}

      # --- app <-> sidecar ---------------------------------------------
      SIDECAR_SHARED_SECRET: ${SIDECAR_SHARED_SECRET}
      # Now the container's OWN address. Two consumers, both correct with
      # this value: /api/sidecar/info renders the user-facing VNC connect
      # link from it, and the settings-save password push POSTs to
      # http://$SIDECAR_IP:6081/refresh-vnc-password (a container reaching
      # its own macvlan address goes out and straight back in via loopback).
      # The old 10.0.12.40 default is dead -- do not reintroduce it.
      SIDECAR_IP: ${CONTAINER_IP}

      # --- sidecar -----------------------------------------------------
      # Loopback now, not the macvlan round-trip. This is also why the
      # HOSTNAME=0.0.0.0 override in the Dockerfile matters more than ever:
      # without it Next.js binds only the macvlan IP and every one of these
      # calls gets ECONNREFUSED.
      TRACKER_URL: http://127.0.0.1:3000
      TRACKER_USER_ID: ${SIDECAR_TRACKER_USER_ID}
      # Fallback VNC password if no user has set one in Settings yet.
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      POLL_INTERVAL_MS: "60000"

      # --- gift-card OCR (DORMANT) -------------------------------------
      # Master switch for the whole feature. Every OCR route 404s and the
      # /orders/<id>/giftcard-ocr screen notFound()s unless this is exactly
      # "true", so the OCR process running inside this container changes
      # nothing about how the app behaves. Default off, deliberately: see
      # giftcard-ocr/README.md for what still has to be decided before it is
      # switched on.
      GIFTCARD_OCR_ENABLED: ${GIFTCARD_OCR_ENABLED:-false}
      GIFTCARD_OCR_URL: http://127.0.0.1:8080
      # One value now serves both ends -- it can no longer drift between the
      # caller and the service, which was a real footgun with two services.
      # Still worth setting: 8080 is reachable on the macvlan address.
      GIFTCARD_OCR_SECRET: ${GIFTCARD_OCR_SECRET:-}
      # "medium" = PP-OCRv6_medium (what the accuracy in the README was
      # measured with). "mobile" = PP-OCRv5_mobile — faster; see the README
      # for the measured accuracy trade.
      OCR_MODEL_SET: ${GIFTCARD_OCR_MODEL_SET:-medium}
      # How many CPUs the OCR process is pinned to (0 = no pinning) and how
      # far it is niced down. See docker/start-ocr.sh.
      GIFTCARD_OCR_CPUS: ${GIFTCARD_OCR_CPUS:-2}
      GIFTCARD_OCR_NICE: ${GIFTCARD_OCR_NICE:-15}

      # --- supervision -------------------------------------------------
      # Whitespace-separated supervisord program names whose FATAL state
      # takes the container down with exit 137 so Docker restarts it
      # (docker/critical-exit.py). Valid names: app xvfb x11vnc websockify
      # login-queue poll giftcard-ocr. `poll` is deliberately NOT in the
      # default -- a poll.js crash-loop should not take the dashboard
      # offline. giftcard-ocr must never be added: it ships dormant.
      CRITICAL_PROGRAMS: ${CRITICAL_PROGRAMS:-app xvfb}
    restart: unless-stopped

networks:
  br0:
    external: true
    name: br0
